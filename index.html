<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>JS Ascent: Intermediate JavaScript LMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f1f2f8;
        --surface: #ffffff;
        --ink: #171a33;
        --muted: #5b6082;
        --line: #dcdfec;
        --brand: #4a3fd6;
        --on-brand: #ffffff;
        --soft: #e7e5fb;
        --ok: #0b8a74;
        --ok-soft: #d8f2ec;
        --warn: #a86b00;
        --warn-soft: #fbebc8;
        --bad: #c93a52;
        --shadow: 0 1px 2px rgba(23, 26, 51, 0.06);
        --f-head: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
        --f-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
        --f-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #101228;
          --surface: #191c38;
          --ink: #eceefb;
          --muted: #a0a5c9;
          --line: #2b2f58;
          --brand: #9a92ff;
          --on-brand: #101228;
          --soft: #2a2762;
          --ok: #46d1b4;
          --ok-soft: #14383a;
          --warn: #f0b84a;
          --warn-soft: #3c3016;
          --bad: #ff7088;
          --shadow: none;
        }
      }
      :root[data-theme="dark"] {
        --bg: #101228;
        --surface: #191c38;
        --ink: #eceefb;
        --muted: #a0a5c9;
        --line: #2b2f58;
        --brand: #9a92ff;
        --on-brand: #101228;
        --soft: #2a2762;
        --ok: #46d1b4;
        --ok-soft: #14383a;
        --warn: #f0b84a;
        --warn-soft: #3c3016;
        --bad: #ff7088;
        --shadow: none;
      }
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.55 var(--f-body);
      }
      h1,
      h2,
      h3 {
        font-family: var(--f-head);
        line-height: 1.15;
        margin: 0 0 0.4em;
        letter-spacing: -0.01em;
      }
      h1 {
        font-size: clamp(1.8rem, 3.4vw, 2.5rem);
        font-weight: 700;
      }
      h2 {
        font-size: 1.45rem;
        font-weight: 650;
      }
      h3 {
        font-size: 1.1rem;
        font-weight: 650;
      }
      a {
        color: var(--brand);
      }
      p {
        margin: 0.4em 0;
      }
      code {
        font-family: var(--f-mono);
        font-size: 0.88em;
        background: var(--soft);
        padding: 0.08em 0.35em;
        border-radius: 5px;
      }
      :focus-visible {
        outline: 3px solid var(--brand);
        outline-offset: 2px;
        border-radius: 6px;
      }
      .app {
        display: grid;
        grid-template-columns: 250px minmax(0, 1fr);
        min-height: 100vh;
      }
      #side {
        position: sticky;
        top: 0;
        align-self: start;
        height: 100vh;
        padding: 22px 16px;
        border-right: 1px solid var(--line);
        background: var(--surface);
        display: flex;
        flex-direction: column;
        gap: 22px;
        overflow: auto;
      }
      .brand {
        display: flex;
        gap: 11px;
        align-items: center;
      }
      .brand b {
        display: block;
        font-family: var(--f-head);
        font-size: 1.15rem;
      }
      .brand span:not(.logo) {
        font-size: 0.8rem;
        color: var(--muted);
      }
      .logo {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border-radius: 11px;
        background: var(--brand);
        color: var(--on-brand);
        font-family: var(--f-head);
        font-weight: 800;
        font-size: 1.05rem;
      }
      nav {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      nav a {
        padding: 9px 12px;
        border-radius: 9px;
        color: var(--ink);
        text-decoration: none;
        font-weight: 550;
      }
      nav a:hover {
        background: var(--bg);
      }
      nav a.on {
        background: var(--soft);
        color: var(--brand);
        font-weight: 700;
      }
      .sideprog {
        margin-top: auto;
        display: flex;
        flex-direction: column;
        gap: 7px;
        font-size: 0.92rem;
      }
      #main {
        padding: 34px clamp(16px, 3.5vw, 44px) 70px;
        max-width: 1120px;
        width: 100%;
      }
      .lead {
        color: var(--muted);
        max-width: 62ch;
        margin-bottom: 20px;
      }
      .sub {
        color: var(--muted);
        font-size: 0.88rem;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 18px 20px;
        margin-bottom: 16px;
        box-shadow: var(--shadow);
      }
      .rowb {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      .rowb select {
        margin-left: auto;
      }
      .bar {
        height: 9px;
        background: var(--bg);
        border-radius: 99px;
        overflow: hidden;
        border: 1px solid var(--line);
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--brand);
        border-radius: 99px;
        transition: width 0.35s;
      }
      .bar.warn i {
        background: var(--warn);
      }
      .btn {
        display: inline-block;
        border: 0;
        background: var(--brand);
        color: var(--on-brand);
        font: inherit;
        font-weight: 650;
        padding: 10px 18px;
        border-radius: 10px;
        cursor: pointer;
        text-decoration: none;
      }
      .btn:hover {
        filter: brightness(1.08);
      }
      .btn.ghost {
        background: transparent;
        color: var(--brand);
        border: 1.5px solid var(--brand);
      }
      .btn.bad {
        background: var(--bad);
        color: #fff;
      }
      .btnrow {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      input,
      select,
      textarea {
        font: inherit;
        color: var(--ink);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 9px 11px;
        width: 100%;
      }
      textarea {
        resize: vertical;
        font-family: var(--f-body);
      }
      #bk {
        font-family: var(--f-mono);
        font-size: 0.78rem;
      }
      select {
        width: auto;
        max-width: 100%;
      }
      .fl {
        display: flex;
        flex-direction: column;
        gap: 5px;
        font-weight: 600;
        font-size: 0.9rem;
        margin: 10px 0 0;
      }
      .fl.grow {
        flex: 1;
        min-width: 200px;
      }
      .pform {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        align-items: flex-end;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
        margin: 18px 0;
      }
      .stat {
        display: flex;
        gap: 14px;
        align-items: center;
        margin: 0;
        padding: 16px;
      }
      .stat .big {
        font-family: var(--f-head);
        font-size: 1.7rem;
        font-weight: 700;
        line-height: 1;
        white-space: nowrap;
      }
      .stat .big.pace {
        font-size: 1.05rem;
        white-space: normal;
        line-height: 1.2;
      }
      .pace.ok {
        color: var(--ok);
      }
      .pace.warn {
        color: var(--warn);
      }
      .stat .k {
        font-weight: 650;
      }
      .ring {
        --p: 0;
        width: 64px;
        height: 64px;
        flex: none;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: conic-gradient(
          var(--brand) calc(var(--p) * 1%),
          var(--bg) 0
        );
      }
      .ring span {
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: var(--surface);
        font-family: var(--f-head);
        font-weight: 700;
        font-size: 0.95rem;
      }
      .cols {
        display: grid;
        grid-template-columns: minmax(0, 1.7fr) minmax(260px, 1fr);
        gap: 22px;
        align-items: start;
      }
      .cols2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .cols2 > .card {
        margin-bottom: 16px;
      }
      .today-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 12px;
      }
      .today-head h2 {
        margin: 0;
      }
      .day {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px 20px 18px;
        margin-bottom: 16px;
      }
      .day.today {
        border: 2px solid var(--brand);
      }
      .day.full {
        background: linear-gradient(0deg, var(--ok-soft), var(--surface) 55%);
      }
      .day header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4px;
      }
      .dno {
        font-weight: 750;
        margin-right: 10px;
      }
      .ddate {
        color: var(--muted);
        font-size: 0.9rem;
        margin-right: 10px;
      }
      .dcount {
        font-weight: 650;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .tag {
        font-size: 0.74rem;
        font-weight: 700;
        padding: 2px 9px;
        border-radius: 99px;
        margin-right: 6px;
      }
      .tag.now {
        background: var(--brand);
        color: var(--on-brand);
      }
      .tag.ok {
        background: var(--ok-soft);
        color: var(--ok);
      }
      .day h3 {
        margin: 2px 0 10px;
      }
      .task {
        display: flex;
        gap: 12px;
        padding: 10px 0;
        border-top: 1px solid var(--line);
      }
      .task:first-of-type {
        border-top: 0;
      }
      .tbody {
        flex: 1;
        min-width: 0;
      }
      .tt {
        font-weight: 650;
        display: flex;
        gap: 10px;
        align-items: baseline;
      }
      .task.on .tt {
        color: var(--muted);
        text-decoration: line-through;
        text-decoration-thickness: 1px;
      }
      .mins {
        font-size: 0.78rem;
        font-weight: 500;
        color: var(--muted);
        text-decoration: none;
      }
      .lnk {
        display: block;
        margin: 2px 0;
        overflow-wrap: anywhere;
      }
      .chk {
        position: relative;
        flex: none;
        width: 26px;
        height: 26px;
        margin-top: 1px;
        cursor: pointer;
      }
      .chk input {
        position: absolute;
        inset: 0;
        opacity: 0;
        margin: 0;
        width: 100%;
        height: 100%;
        cursor: pointer;
      }
      .box {
        display: block;
        width: 26px;
        height: 26px;
        border: 2px solid var(--muted);
        border-radius: 8px;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      .chk input:checked + .box {
        background: var(--ok);
        border-color: var(--ok);
      }
      .chk input:checked + .box::after {
        content: "";
        display: block;
        width: 6px;
        height: 12px;
        border: solid #fff;
        border-width: 0 3px 3px 0;
        transform: translate(7px, 2px) rotate(45deg);
      }
      .chk input:focus-visible + .box {
        outline: 3px solid var(--brand);
        outline-offset: 2px;
      }
      .quizrow {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 12px 0;
        border-top: 1px solid var(--line);
        flex-wrap: wrap;
      }
      .minibars {
        display: flex;
        gap: 5px;
        height: 110px;
        align-items: flex-end;
      }
      .mb {
        flex: 1;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        gap: 4px;
        text-decoration: none;
        color: var(--muted);
        font-size: 0.72rem;
      }
      .mb i {
        display: block;
        width: 100%;
        background: var(--brand);
        border-radius: 4px 4px 0 0;
        min-height: 4px;
        opacity: 0.85;
      }
      .mb.cur span {
        color: var(--brand);
        font-weight: 800;
      }
      .badges {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .badge {
        border: 1px dashed var(--line);
        border-radius: 10px;
        padding: 8px 10px;
        opacity: 0.55;
        display: flex;
        flex-direction: column;
        gap: 2px;
        font-size: 0.78rem;
      }
      .badge b {
        font-size: 0.86rem;
      }
      .badge span {
        color: var(--muted);
      }
      .badge.got {
        opacity: 1;
        border: 1.5px solid var(--ok);
        background: var(--ok-soft);
      }
      .phase {
        margin-bottom: 28px;
      }
      .phead {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 12px;
        margin-bottom: 10px;
      }
      .phead h2 {
        margin: 0;
      }
      .pp {
        font-family: var(--f-head);
        font-size: 1.6rem;
        font-weight: 700;
        color: var(--brand);
      }
      .tiles {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 12px;
      }
      .tile {
        --p: 0%;
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-height: 150px;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 14px;
        text-decoration: none;
        color: var(--ink);
        background: linear-gradient(
          to top,
          var(--soft) var(--p),
          var(--surface) var(--p)
        );
        overflow: hidden;
      }
      .tile:hover {
        border-color: var(--brand);
      }
      .tile.cur {
        border: 2px solid var(--brand);
      }
      .tile.full {
        background: var(--ok-soft);
        border-color: var(--ok);
      }
      .wn {
        font-family: var(--f-head);
        font-weight: 800;
        font-size: 2.3rem;
        line-height: 1;
        color: var(--brand);
      }
      .tile.full .wn {
        color: var(--ok);
      }
      .wt {
        font-weight: 650;
        line-height: 1.25;
      }
      .wd {
        font-size: 0.8rem;
        color: var(--muted);
      }
      .wp {
        margin-top: auto;
        font-weight: 700;
        font-size: 0.85rem;
      }
      .rhythm {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      .rhythm div {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .rhythm span {
        color: var(--muted);
        font-size: 0.92rem;
      }
      .wkhead {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: flex-start;
        flex-wrap: wrap;
      }
      .wknav {
        display: flex;
        gap: 8px;
      }
      .wkhead h1 {
        margin-bottom: 0.2em;
      }
      .topics {
        margin: 0;
        padding-left: 1.2em;
        columns: 2;
        column-gap: 30px;
      }
      .topics li {
        margin: 3px 0;
        break-inside: avoid;
      }
      .days {
        margin-top: 6px;
      }
      .proj summary {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        cursor: pointer;
        list-style: none;
      }
      .proj summary::-webkit-details-marker {
        display: none;
      }
      .pwk {
        font-weight: 700;
        color: var(--brand);
        min-width: 60px;
      }
      .pname {
        font-weight: 650;
        flex: 1;
        min-width: 160px;
      }
      .pst {
        font-size: 0.78rem;
        font-weight: 700;
        padding: 3px 10px;
        border-radius: 99px;
        background: var(--bg);
      }
      .st-doing {
        background: var(--warn-soft);
        color: var(--warn);
      }
      .st-done {
        background: var(--ok-soft);
        color: var(--ok);
      }
      .proj[open] summary {
        margin-bottom: 10px;
      }
      .proj .pform {
        margin-top: 8px;
      }
      .qlist {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .qitem {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        color: var(--ink);
        margin: 0;
        padding: 14px 18px;
      }
      .qitem:hover {
        border-color: var(--brand);
      }
      .back {
        display: inline-block;
        margin-bottom: 10px;
        font-weight: 600;
      }
      fieldset.qq {
        border: 1px solid var(--line);
      }
      .qq legend {
        padding: 0 6px;
      }
      .qt {
        font-weight: 650;
        margin-bottom: 10px;
      }
      .opt {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        margin: 6px 0;
        background: var(--bg);
      }
      .opt.pick {
        cursor: pointer;
      }
      .opt.pick:hover {
        border-color: var(--brand);
      }
      .opt.pick input {
        width: auto;
        accent-color: var(--brand);
      }
      .opt.right {
        background: var(--ok-soft);
        border-color: var(--ok);
      }
      .opt.wrong {
        background: var(--warn-soft);
        border-color: var(--bad);
      }
      .exp {
        color: var(--muted);
        margin-bottom: 0;
      }
      .filters {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 16px;
      }
      .filters input {
        max-width: 420px;
      }
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .chip {
        font: inherit;
        font-weight: 600;
        font-size: 0.88rem;
        padding: 6px 14px;
        border-radius: 99px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
        cursor: pointer;
      }
      .chip.on {
        background: var(--brand);
        color: var(--on-brand);
        border-color: var(--brand);
      }
      .resgrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 14px;
      }
      .res {
        display: flex;
        flex-direction: column;
        gap: 5px;
        text-decoration: none;
        color: var(--ink);
        margin: 0;
      }
      .res:hover {
        border-color: var(--brand);
      }
      .rc {
        font-size: 0.76rem;
        font-weight: 700;
        color: var(--brand);
      }
      .empty {
        color: var(--muted);
        padding: 12px 0;
      }
      .timer {
        font-family: var(--f-head);
        font-size: 3rem;
        font-weight: 700;
        margin: 6px 0 12px;
        font-variant-numeric: tabular-nums;
      }
      .daybars {
        display: flex;
        gap: 6px;
        height: 120px;
        align-items: flex-end;
      }
      .db {
        flex: 1;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        gap: 4px;
        font-size: 0.72rem;
        color: var(--muted);
      }
      .db i {
        display: block;
        width: 100%;
        background: var(--brand);
        border-radius: 4px 4px 0 0;
      }
      .loglist {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .loglist li {
        display: flex;
        gap: 14px;
        align-items: center;
        padding: 9px 0;
        border-top: 1px solid var(--line);
        flex-wrap: wrap;
      }
      .loglist li:first-child {
        border-top: 0;
      }
      .ld {
        min-width: 110px;
        color: var(--muted);
      }
      .lm {
        font-weight: 700;
        min-width: 64px;
      }
      .ln {
        flex: 1;
        min-width: 120px;
      }
      .x {
        font: inherit;
        font-size: 0.85rem;
        background: none;
        border: 0;
        color: var(--bad);
        cursor: pointer;
        text-decoration: underline;
      }
      .cert {
        border: 2px solid var(--ok);
        background: var(--ok-soft);
      }
      .danger {
        border-color: var(--bad);
      }
      #toast {
        position: fixed;
        left: 50%;

      const s = weekStat(w);
      const cur = !p.before && p.week === w.n;
      return `<a class="tile ${s.pct === 100 ? "full" : ""} ${cur ? "cur" : ""}" style="--p:${s.pct}%" href="#/week/${w.n}"><span class="wn">${w.n}</span><span class="wt">${esc(w.title)}</span><span class="wd">${fmtDate(dateOf(w.n, 1), { day: "numeric", month: "short" })} to ${fmtDate(dateOf(w.n, 7), { day: "numeric", month: "short" })}</span><span class="wp">${cur ? "This week, " : ""}${s.pct}%</span></a>`;
    })
    .join("")}</div></section>`;
          }).join("") +
          `<section class="card"><h3>Weekly rhythm</h3><div class="rhythm"><div><b>Days 1 to 5</b><span>Watch (30 min), read (20 min), practice (40 min). About 90 minutes a day.</span></div><div><b>Day 6</b><span>Project day. About 3 hours building the weekly project.</span></div><div><b>Day 7</b><span>Review, quiz and reflection. About 1 hour.</span></div></div></section>`
        );
      }

      function vWeek(n) {
        const p = position();
        n = clamp(Number(n) || (p.before ? 1 : p.week), 1, NW);
        const w = WEEKS[n - 1],
          s = weekStat(w);
        const sel = `<select data-act="weekSel" aria-label="Choose week">${WEEKS.map((x) => `<option value="${x.n}" ${x.n === n ? "selected" : ""}>Week ${x.n}: ${esc(x.title)}</option>`).join("")}</select>`;
        let days = "";
        for (let d = 1; d <= 7; d++)
          days += dayCard(n, d, !p.before && p.week === n && p.day === d);
        return `<div class="wkhead"><div><div class="sub">Week ${n} of ${NW}, ${fmtDate(dateOf(n, 1))} to ${fmtDate(dateOf(n, 7))}</div><h1>${esc(w.title)}</h1><p class="lead">${esc(w.goal)}</p></div><div class="wknav">${n > 1 ? `<a class="btn ghost" href="#/week/${n - 1}">Previous</a>` : ""}${n < NW ? `<a class="btn ghost" href="#/week/${n + 1}">Next</a>` : ""}</div></div>
 <div class="card"><div class="rowb"><b>${s.pct}% complete</b><span class="sub">${s.done} of ${s.total} items</span>${sel}</div>${bar(s.pct)}</div>
 <div class="card"><h3>What you will learn</h3><ul class="topics">${w.topics.map((t) => `<li>${esc(t)}</li>`).join("")}</ul></div>
 <div class="days">${days}</div>
 <div class="card"><h3>Week ${n} notes</h3><label class="fl"><span class="sub">Saved automatically in this browser.</span><textarea data-act="note" data-n="${n}" rows="6" placeholder="Jot down code snippets, definitions, questions to revisit...">${esc(S.notes[n] || "")}</textarea></label></div>`;
      }

      const openProj = new Set();
      const STAT = {
        todo: "Not started",
        doing: "In progress",
        done: "Submitted",
      };
      function vProjects(arg) {
        const p = position();
        const focus = Number(arg) || (p.before ? 0 : p.week);
        if (focus) openProj.add(focus);
        const dn = Object.values(S.proj).filter(
          (x) => x.status === "done",
        ).length;
        return (
          `<h1>Projects</h1><p class="lead">One project every week. Tick each requirement, add your GitHub or live link, then mark it submitted. ${dn} of ${NW} submitted.</p>` +
          WEEKS.map((w) => {
            const pr = S.proj[w.n] || { status: "todo", link: "" };
            const rd = w.proj.reqs.filter(
              (_, i) => S.done[`${w.n}.pr.${i}`],
            ).length;
            return `<details class="card proj" data-proj="${w.n}" ${openProj.has(w.n) ? "open" : ""}><summary><span class="pwk">Week ${w.n}</span><span class="pname">${esc(w.proj.name)}</span><span class="pst st-${pr.status}">${STAT[pr.status]}</span><span class="sub">${rd}/${w.proj.reqs.length}</span></summary>
  <p>${esc(w.proj.desc)}</p>${w.proj.reqs.map((r, i) => task(`${w.n}.pr.${i}`, r, "")).join("")}<p class="sub">Stretch goal: ${esc(w.proj.stretch)}</p>
  <div class="pform"><label class="fl">Status<select data-act="pstatus" data-n="${w.n}">${Object.entries(
    STAT,
  )
    .map(
      ([k, v]) =>
        `<option value="${k}" ${pr.status === k ? "selected" : ""}>${v}</option>`,
    )
    .join("")}</select></label>
  <label class="fl grow">GitHub or live link<input type="url" data-act="plink" data-n="${w.n}" value="${esc(pr.link)}" placeholder="https://github.com/you/project"></label></div></details>`;
          }).join("")
        );
      }

      const retake = {};
      function vQuiz(arg) {
        const n = Number(arg);
        if (!n) {
          return (
            `<h1>Quizzes</h1><p class="lead">Two questions per week to check your understanding. Retake as often as you like.</p><div class="qlist">` +
            WEEKS.map((w) => {
              const q = S.quiz[w.n];
              return `<a class="card qitem" href="#/quiz/${w.n}"><span class="pwk">Week ${w.n}</span><span class="pname">${esc(w.title)}</span><span class="pst ${q ? (q.score === q.total ? "st-done" : "st-doing") : "st-todo"}">${q ? q.score + "/" + q.total : "Not taken"}</span></a>`;
            }).join("") +
            `</div>`
          );
        }
        const w = WEEKS[clamp(n, 1, NW) - 1],
          res = S.quiz[w.n];
        const head = `<a class="back" href="#/quiz">All quizzes</a><h1>Week ${w.n} quiz</h1><p class="lead">${esc(w.title)}</p>`;
        if (res && !retake[w.n]) {
          return (
            head +
            `<div class="card"><h2>Score: ${res.score} of ${res.total}</h2>${bar(Math.round((res.score / res.total) * 100), res.score === res.total ? "" : "warn")}</div>` +
            w.quiz
              .map((q, i) => {
                const ok = res.answers[i] === q.a;
                return `<div class="card qq"><div class="qt">${i + 1}. ${fmt(q.q)}</div>${q.o.map((o, j) => `<div class="opt ${j === q.a ? "right" : ""} ${j === res.answers[i] && !ok ? "wrong" : ""}">${esc(o)}${j === q.a ? "<b> Correct</b>" : ""}${j === res.answers[i] && !ok ? "<b> Your answer</b>" : ""}</div>`).join("")}<p class="exp"><b>${ok ? "Right." : "Not quite."}</b> ${esc(q.e)}</p></div>`;
              })
              .join("") +
            `<button class="btn" data-act="retake" data-n="${w.n}">Retake quiz</button>`
          );
        }
        return (
          head +
          w.quiz
            .map(
              (q, i) =>
                `<fieldset class="card qq"><legend class="qt">${i + 1}. ${fmt(q.q)}</legend>${q.o.map((o, j) => `<label class="opt pick"><input type="radio" name="q${i}" value="${j}"><span>${esc(o)}</span></label>`).join("")}</fieldset>`,
            )
            .join("") +
          `<button class="btn" data-act="submitQuiz" data-n="${w.n}">Submit answers</button>`
        );
      }

      let resCat = "All",
        resQ = "";
      function resList() {
        const q = resQ.toLowerCase();
        const l = RESOURCES.filter(
          (r) =>
            (resCat === "All" || r.c === resCat) &&
            (!q || (r.t + " " + r.d + " " + r.c).toLowerCase().includes(q)),
        );
        return l.length
          ? l
              .map(
                (r) =>
                  `<a class="card res" href="${r.u}" target="_blank" rel="noopener noreferrer"><span class="rc">${esc(r.c)}</span><b>${esc(r.t)}</b><span class="sub">${esc(r.d)}</span></a>`,
              )
              .join("")
          : '<p class="empty">No resources match. Try a different word or category.</p>';
      }
      function vResources() {
        const cats = ["All", ...new Set(RESOURCES.map((r) => r.c))];
        return `<h1>Resources</h1><p class="lead">Trusted free material to use alongside the daily plan. Every item is free to use.</p>
 <div class="filters"><input type="search" id="rsearch" data-act="rsearch" placeholder="Search resources" value="${esc(resQ)}" aria-label="Search resources"><div class="chips">${cats.map((c) => `<button class="chip ${c === resCat ? "on" : ""}" data-act="rcat" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div></div><div class="resgrid" id="reslist">${resList()}</div>`;
      }

      function tmrText() {
        if (!S.timer) return "00:00";
        const s = Math.floor((Date.now() - S.timer) / 1000);
        return z2(Math.floor(s / 60)) + ":" + z2(s % 60);
      }
      function vJournal() {
        const p = position();
        const days = [];
        for (let i = 13; i >= 0; i--) {
          const d = addDays(todayStr(), -i);
          days.push({
            d,
            m: S.log.filter((l) => l.date === d).reduce((a, l) => a + l.min, 0),
          });
        }
        const mx = Math.max(60, ...days.map((x) => x.m));
        const logs = S.log
          .map((l, i) => ({ ...l, i }))
          .sort((a, b) => b.date.localeCompare(a.date) || b.i - a.i);
        return `<h1>Study log</h1><p class="lead">Track how long you study. Logged time counts toward your streak and weekly goal.</p>
 <div class="cols2"><div class="card"><h3>Study timer</h3><div class="timer" id="tmr">${tmrText()}</div>${S.timer ? `<button class="btn" data-act="tmrStop">Stop and save</button>` : `<button class="btn" data-act="tmrStart">Start session</button>`}</div>
 <form class="card" data-act="addLog"><h3>Add a session manually</h3><div class="pform"><label class="fl">Date<input type="date" name="date" value="${todayStr()}" required></label><label class="fl">Minutes<input type="number" name="min" min="1" max="600" value="60" required></label></div><label class="fl">What did you study?<input type="text" name="note" maxlength="120" placeholder="Closures, practice problems..."></label><button class="btn" type="submit">Save session</button></form></div>
 <div class="card"><h3>Last 14 days</h3><div class="daybars">${days.map((x) => `<div class="db" title="${fmtDate(x.d)}: ${fmtMin(x.m)}"><i style="height:${Math.max(2, (x.m / mx) * 100)}%"></i><span>${parseD(x.d).getDate()}</span></div>`).join("")}</div></div>
 <div class="card"><h3>Sessions</h3>${logs.length ? `<ul class="loglist">${logs.map((l) => `<li><span class="ld">${fmtDate(l.date)}</span><span class="lm">${fmtMin(l.min)}</span><span class="ln">${esc(l.note || "Study session")}</span><button class="x" data-act="delLog" data-i="${l.i}" aria-label="Delete session">Delete</button></li>`).join("")}</ul>` : '<p class="empty">No sessions yet. Start the timer or add one above.</p>'}</div>`;
      }

      function vSettings() {
        const o = overall();
        return `<h1>Settings</h1>
 <div class="card"><h3>Your plan</h3><div class="pform"><label class="fl grow">Your name<input type="text" data-act="name" value="${esc(S.name)}" placeholder="Used in greetings"></label><label class="fl">Start date<input type="date" data-act="start" value="${S.start}"></label><label class="fl">Weekly study goal (hours)<input type="number" min="1" max="60" data-act="goal" value="${S.goal}"></label></div><p class="sub">Changing the start date moves every week and day on the schedule.</p></div>
 <div class="card"><h3>Appearance</h3><label class="fl">Theme<select data-act="theme"><option value="auto" ${S.theme === "auto" ? "selected" : ""}>Match my device</option><option value="light" ${S.theme === "light" ? "selected" : ""}>Light</option><option value="dark" ${S.theme === "dark" ? "selected" : ""}>Dark</option></select></label></div>
 <div class="card"><h3>Backup and restore</h3><p class="sub">Your progress is saved in this browser only. Copy the text below to back it up, or paste a backup and restore it on another device.</p><textarea id="bk" rows="5" aria-label="Backup data">${esc(JSON.stringify(S))}</textarea><div class="btnrow"><button class="btn" data-act="copyBk">Copy backup</button><button class="btn ghost" data-act="restoreBk">Restore from pasted text</button></div></div>
 ${o.pct === 100 ? `<div class="card cert"><h3>Certificate of completion</h3><p><b>${esc(S.name || "Learner")}</b> completed the 14-week Intermediate JavaScript track on ${fmtDate(todayStr(), { day: "numeric", month: "long", year: "numeric" })}.</p></div>` : ""}
 <div class="card danger"><h3>Reset progress</h3><p class="sub">Erase all progress, notes and study log from this browser. This cannot be undone.</p><button class="btn bad" data-act="reset">Reset everything</button></div>`;
      }

      /* ---------- render ---------- */
      function sideHTML() {
        const o = overall(),
          p = position();
        return `<div class="brand"><span class="logo">JS</span><div><b>JS Ascent</b><span>Intermediate track</span></div></div>
 <nav aria-label="Main">${NAV.map(([k, l]) => {
   const on = route.name === k;
   const href = k === "week" ? `#/week/${p.before ? 1 : p.week}` : `#/${k}`;
   return `<a href="${href}" class="${on ? "on" : ""}" ${on ? 'aria-current="page"' : ""}>${l}</a>`;
 }).join("")}</nav>
 <div class="sideprog"><div class="rowb"><span>Overall</span><b>${o.pct}%</b></div>${bar(o.pct)}<span class="sub">Streak: ${streak()} days</span></div>`;
      }
      function render() {
        const views = {
          dash: vDash,
          roadmap: vRoadmap,
          week: vWeek,
          projects: vProjects,
          quiz: vQuiz,
          resources: vResources,
          journal: vJournal,
          settings: vSettings,
        };
        if (!views[route.name]) route = { name: "dash", arg: null };
        document.documentElement.dataset.theme =
          S.theme === "auto" ? "" : S.theme;
        $("#side").innerHTML = sideHTML();
        $("#main").innerHTML = views[route.name](route.arg);
      }
      function applyTheme() {
        if (S.theme === "auto") delete document.documentElement.dataset.theme;
        else document.documentElement.dataset.theme = S.theme;
      }

      /* ---------- events ---------- */
      document.addEventListener("click", (e) => {
        const t = e.target.closest("[data-act]");
        if (!t) return;
        const a = t.dataset.act;
        if (a === "startToday") {
          S.start = todayStr();
          save();
          render();
        } else if (a === "rcat") {
          resCat = t.dataset.c;
          render();
        } else if (a === "retake") {
          retake[t.dataset.n] = true;
          render();
          window.scrollTo(0, 0);
        } else if (a === "submitQuiz") {
          const n = Number(t.dataset.n),
            w = WEEKS[n - 1];
          const ans = w.quiz.map((q, i) => {
            const c = document.querySelector(`input[name=q${i}]:checked`);
            return c ? Number(c.value) : -1;
          });
          if (ans.includes(-1)) {
            toast("Answer every question before submitting");
            return;
          }
          const score = ans.filter((x, i) => x === w.quiz[i].a).length;
          const first = !S.quiz[n];
          S.quiz[n] = {
            score,
            total: ans.length,
            answers: ans,
            date: todayStr(),
          };
          delete retake[n];
          if (first) bump(null, 1);
          save();
          render();
          window.scrollTo(0, 0);
          checkBadges();
        } else if (a === "tmrStart") {
          S.timer = Date.now();
          save();
          render();
        } else if (a === "tmrStop") {
          const m = Math.max(1, Math.round((Date.now() - S.timer) / 60000));
          S.log.push({ date: todayStr(), min: m, note: "Timed study session" });
          bump(null, 1);
          S.timer = null;
          save();
          render();
          toast("Saved " + fmtMin(m));
          checkBadges();
        } else if (a === "delLog") {
          S.log.splice(Number(t.dataset.i), 1);
          save();
          render();
        } else if (a === "copyBk") {
          const ta = $("#bk");
          ta.select();
          let ok = false;
          try {
            ok = document.execCommand("copy");
          } catch (x) {}
          if (!ok && navigator.clipboard) {
            navigator.clipboard
              .writeText(ta.value)
              .then(() => toast("Backup copied"))
              .catch(() => toast("Select the text and copy it manually"));
            return;
          }
          toast(ok ? "Backup copied" : "Select the text and copy it manually");
        } else if (a === "restoreBk") {
          try {
            const d = JSON.parse($("#bk").value);
            if (!d || typeof d !== "object" || !d.done) throw 0;
            S = Object.assign(defState(), d);
            save();
            render();
            toast("Progress restored");
          } catch (x) {
            toast("That text is not a valid backup");
          }
        } else if (a === "reset") {
          if (
            confirm(
              "Erase all progress, notes and study log? This cannot be undone.",
            )
          ) {
            S = defState();
            save();
            location.hash = "#/dash";
            render();
            toast("Progress reset");
          }
        }
      });
      document.addEventListener("change", (e) => {
        const t = e.target.closest("[data-act]");
        if (!t) return;
        const a = t.dataset.act,
          n = t.dataset.n;
        if (a === "toggle") {
          const k = t.dataset.k;
          if (t.checked) {
            S.done[k] = true;
            bump(null, 1);
          } else {
            delete S.done[k];
            bump(null, -1);
          }
          save();
          render();
          if (t.checked) checkBadges();
        } else if (a === "weekSel") go("week", t.value);
        else if (a === "pstatus") {
          S.proj[n] = Object.assign({ status: "todo", link: "" }, S.proj[n], {
            status: t.value,
          });
          if (t.value === "done") bump(null, 1);
          save();
          render();
          checkBadges();
        } else if (a === "plink") {
          S.proj[n] = Object.assign({ status: "todo", link: "" }, S.proj[n], {
            link: t.value.trim(),
          });
          save();
        } else if (a === "name") {
          S.name = t.value.trim().slice(0, 40);
          save();
          render();
        } else if (a === "start") {
          if (t.value) {
            S.start = t.value;
            save();
            render();
          }
        } else if (a === "goal") {
          S.goal = clamp(Number(t.value) || 10, 1, 60);
          save();
          render();
        } else if (a === "theme") {
          S.theme = t.value;
          save();
          render();
        }
      });
      document.addEventListener("input", (e) => {
        const t = e.target.closest("[data-act]");
        if (!t) return;
        const a = t.dataset.act;
        if (a === "note") {
          S.notes[t.dataset.n] = t.value;
          save();
        } else if (a === "reflect") {
          S.reflect[t.dataset.n] = t.value;
          save();
        } else if (a === "rsearch") {
          resQ = t.value;
          $("#reslist").innerHTML = resList();
        }
      });
      document.addEventListener("submit", (e) => {
        const f = e.target.closest('form[data-act="addLog"]');
        if (!f) return;
        e.preventDefault();
        const d = new FormData(f);
        const min = clamp(Math.round(Number(d.get("min")) || 0), 1, 600);
        const date = d.get("date") || todayStr();
        S.log.push({
          date,
          min,
          note: String(d.get("note") || "")
            .trim()
            .slice(0, 120),
        });
        bump(date, 1);
        save();
        render();
        toast("Saved " + fmtMin(min));
        checkBadges();
      });
      document.addEventListener(
        "toggle",
        (e) => {
          const t = e.target;
          if (t.matches && t.matches("details[data-proj]")) {
            const n = Number(t.dataset.proj);
            t.open ? openProj.add(n) : openProj.delete(n);
          }
        },
        true,
      );
      window.addEventListener("hashchange", () => {
        parseRoute();
        render();
        window.scrollTo(0, 0);
      });
      setInterval(() => {
        const el = $("#tmr");
        if (el && S.timer) el.textContent = tmrText();
      }, 1000);

      /* ---------- boot ---------- */
      load();
      parseRoute();
      render();
    </script>
  </body>
</html>
